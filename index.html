<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주차배정표 v2.8</title>
<!--
  프로젝트: 주차배정표 / P.no (v1.6~v2.8 요청에 미기재 · 직전 #001-202611-06)
  파일명 규칙: 제목 + 버전 + 일자(yymmdd) + 생성시간(hhmm)  예) 주차배정표_v2.8_261109_0010.html
  버전 규칙: 초기 v1.0 / [업데이트] 0.1 단위 / [수정] 0.01 단위
-->
<style>
:root{--pri:#2f5d8a;--pri2:#e8eff7;--bg:#f3f5f8;--line:#d5dce5;--txt:#222;--sub:#6b7785;--red:#c0392b;--blue:#1f5fa8;--ok:#2e8b57}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button,select,input,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px 0;position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:19px;display:inline-block}
.ver{font-size:12px;font-weight:700;color:#fff;background:var(--pri);border-radius:10px;padding:2px 8px;vertical-align:middle;margin-left:4px}
.pno{display:inline-block;margin-left:8px;color:var(--sub);font-size:12px}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
main{max-width:1100px;margin:0 auto;padding:14px}
.page{display:none}.page.on{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card h3{margin:14px 0 6px;font-size:14px;color:var(--pri)}
.hint{color:var(--sub);font-size:12px;line-height:1.5}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px}
.btn:hover{background:var(--pri2)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.pri:hover{background:#244b70}
.btn.warn{color:var(--red);border-color:#e3b5af}
.btn.sm{padding:3px 8px;font-size:12px}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;max-width:100%}
textarea{width:100%;resize:vertical}
.tw{overflow-x:auto}
/* 월별 박스 */
.mbx{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.mh{background:var(--pri);color:#fff;font-weight:800;padding:8px 12px;font-size:15px;letter-spacing:.5px}
.mh small{font-weight:400;opacity:.8;margin-left:6px}
.mh .mu .mul{color:#ffe08a;font-weight:800;margin-right:2px}
.mh .mu .mun{color:#c8f5dc;font-weight:700}
table.grid{border-collapse:collapse;width:100%;min-width:640px}
table.grid th,table.grid td{border:1px solid var(--line);padding:5px 6px;text-align:center;vertical-align:middle}
.mbx table.grid{border-left:0;border-right:0}
table.grid th{background:#4a74a0;color:#fff;font-weight:700}
.card table.grid th{background:var(--pri)}
table.grid th small{display:block;font-weight:400;font-size:11px;opacity:.85}
table.grid td select{width:100%;min-width:84px}
span.rc{display:block;font-size:.78em;font-weight:400;color:#8a5a00;white-space:normal;line-height:1.25}
#printSheet span.rc{color:#6b4500}
#meetWrap .rg{display:flex;flex-wrap:wrap;justify-content:center;gap:0 4px;margin-top:2px}
#meetWrap .rg label{font-size:11px;color:#fff;font-weight:400;white-space:nowrap;display:inline-flex;align-items:center;gap:1px}
#meetWrap .rg input{margin:0;width:auto}
tr.mrow td{background:#dce7f3;font-weight:800;text-align:center}
select.lk{background:#e3f0fb;border-color:#b9d6f0}
select.lv{background:#fdeaf0;border-color:#f1c3d2}
.meet td,.meet th{text-align:center}
.meet td select{text-align-last:center;text-align:center}
table.grid td.dcell{text-align:left;white-space:nowrap;background:var(--pri2)}
table.grid td.dcell .x{border:0;background:none;color:#999;font-size:16px;margin-left:4px;padding:0 4px}
table.grid tr.sun td.dcell b{color:var(--red)}
table.grid tr.sat td.dcell b{color:var(--blue)}
table.grid tr.past td{opacity:.62}
table.grid tr.today td.dcell{box-shadow:inset 4px 0 0 var(--ok)}
table.grid td.ns select{text-decoration:line-through;color:var(--red);border-color:#e3b5af}
table.grid td.ns{color:var(--red);text-decoration:line-through}
table.grid td.ev{background:#fff3cd;font-weight:700}
table.grid td.conf{background:#fde8e6;box-shadow:inset 0 0 0 2px var(--red)}
table.grid td.conf select{background:#fde8e6}
.nsb{display:block;margin:3px auto 0;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:11px;padding:1px 8px;color:var(--sub)}
.nsb.on{background:var(--red);border-color:var(--red);color:#fff}
.note{width:100%;min-width:130px}
table.grid td.left{text-align:left}
.evl{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--sub);margin-left:6px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:12px;padding:2px 8px;margin:2px;font-size:12px;white-space:nowrap}
.chip input{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}
.row label{display:inline-flex;align-items:center;gap:4px}
.rules ol{margin:6px 0 0;padding-left:20px;line-height:1.7}
.rules li{margin-bottom:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:4px;color:#fff}
.tag.must{background:var(--red)}.tag.soft{background:var(--ok)}.tag.opt{background:var(--sub)}
.log{background:#f7f9fb;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.6;margin-top:8px;white-space:pre-wrap}
.empty{padding:18px;text-align:center;color:var(--sub);background:#fafbfc;border:1px dashed var(--line);border-radius:8px}
.okbox{background:#eaf6ef;border:1px solid #bfe0cd;color:#1d6b43;border-radius:8px;padding:8px 12px;font-size:13px}
.errbox{background:#fdf0ee;border:1px solid #efc1ba;color:#9b2c20;border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.7}
/* 뷰어 */
table.grid td.rec{box-shadow:inset 4px 0 0 #e8a33d}
.rtag{display:block;font-size:11px;color:#9a6a2a;margin-top:2px;font-weight:400;line-height:1.3}
table.duty{table-layout:fixed;min-width:560px}
table.duty th:first-child,table.duty td:first-child{width:170px}
table.duty td select{width:100%}
.addbox{background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.mh.tg{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.mh .car{display:inline-block;width:1.1em;font-size:12px}
.bt{cursor:pointer;user-select:none}
.bt .car{display:inline-block;width:1.1em;font-size:12px;color:var(--sub)}
.sortable{cursor:pointer;user-select:none;white-space:nowrap}
.sortable:hover{filter:brightness(1.15)}
.mu{margin-left:auto;font-weight:600;font-size:13px;text-align:right;white-space:normal}
.abchip{white-space:normal;margin:1px 2px 1px 0}
table.grid td.abcell{text-align:left;vertical-align:top}
.abn{white-space:normal;font-size:11px;color:#b03a2e;font-weight:400;line-height:1.35;margin-top:2px}
.vt{font-size:var(--vs,18px)}
.vt th,.vt td{padding:.45em .5em;font-size:1em}
.vt th{font-size:.85em}
.vt td select{font-size:1em}
.modal{display:none;position:fixed;inset:0;background:rgba(20,30,40,.55);z-index:100;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto}
.modal.open{display:flex}
.mbox2{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mbox2 h2{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.mbox2 .close{border:0;background:none;font-size:22px;color:#777}
.rel{border-left:3px solid var(--pri);padding:4px 0 4px 10px;margin-bottom:12px}
.rel b{color:var(--pri)}
.rel ul{margin:4px 0 0;padding-left:18px;line-height:1.6}
#printModal{padding:0;background:#e6e9ee;align-items:stretch;justify-content:stretch}
#printModal .pm{display:flex;flex-direction:column;width:100%;height:100vh}
.pm-bar{background:#fff;border-bottom:1px solid var(--line);padding:8px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pm-bar label{display:inline-flex;align-items:center;gap:4px}
.pm-body{flex:1;overflow:auto;padding:12px}
#scaleBox{margin:0 auto;overflow:hidden}
#printSheet{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25);transform-origin:0 0;overflow:hidden;color:#000}
.ps-title{text-align:center;font-weight:800;font-size:1.6em;margin:.1em 0 .25em}
.ps-meta{text-align:right;font-size:.7em;color:#555;margin-bottom:.4em}
#printSheet table{width:100%;border-collapse:collapse}
#printSheet th,#printSheet td{border:1px solid #333;padding:.38em .45em;text-align:center;word-break:keep-all}
#printSheet th{background:#2f5d8a;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printSheet td.d{background:#eef3f8;font-weight:700;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printSheet td.d.sun{color:#c0392b}#printSheet td.d.sat{color:#1f5fa8}
#printSheet table{table-layout:fixed}
#printSheet td.n,#printSheet.scr td.dcell,#printSheet.scr td.left{text-align:center}
#printSheet.scr *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printSheet.scr .mbx{border:1px solid var(--line);border-radius:8px;margin-bottom:.55em;overflow:hidden;break-inside:avoid}
#printSheet.scr .mh{background:var(--pri);color:#fff;font-weight:800;padding:.3em .7em;display:flex;align-items:center;gap:.4em}
#printSheet.scr .mh small{font-weight:400;opacity:.85}
#printSheet.scr .mh .mu{margin-left:auto;font-weight:600;font-size:.85em}
#printSheet.scr table{border-collapse:collapse}
#printSheet.scr th{background:var(--pri);color:#fff;border:1px solid #fff3}
#printSheet.scr th small{display:block;font-weight:400;font-size:.7em;opacity:.85}
#printSheet.scr td{border:1px solid var(--line);padding:.3em .45em}
#printSheet.scr td.dcell{text-align:center;white-space:nowrap;background:var(--pri2)}
#printSheet.scr tr.sun td.dcell b{color:var(--red)}#printSheet.scr tr.sat td.dcell b{color:var(--blue)}
#printSheet.scr tr.past td{opacity:.62}
#printSheet.scr td.ns{color:var(--red);text-decoration:line-through}
#printSheet.scr td.left{text-align:center}
#printSheet tr.mrow td{background:#dce7f3;font-weight:800;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printSheet td.ev{background:#fff3cd;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printSheet tr{page-break-inside:avoid}
.userbox{float:right;font-size:12px;color:var(--sub);display:none;align-items:center;gap:6px}
.userbox.on{display:inline-flex}
body.locked main,body.locked #tabs{visibility:hidden}
body.ro #page-input,body.ro #page-usher,body.ro #page-meet{pointer-events:none;opacity:.85}
.authbox{background:#fff;border-radius:12px;max-width:380px;width:100%;margin-top:12vh;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.authbox h3{margin:0 0 10px}
.authbox input[type=password],.authbox input[type=text]{width:100%;padding:9px;font-size:16px;margin:4px 0}
.authbox .err{color:var(--red);font-size:13px;min-height:1.2em;margin:4px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:.95}
canvas.pv{max-width:100%;border:1px solid var(--line);border-radius:6px}
@media(max-width:560px){main{padding:10px}.top h1{font-size:17px}.pno{display:none}}
@media print{
 html,body{background:#fff!important;height:auto!important}
 #app,.modal,.toast{display:none!important}
 #printModal.open{display:block!important;position:static!important;background:none!important;overflow:visible!important;padding:0!important}
 #printModal .pm{display:block!important;height:auto!important}
 .pm-bar{display:none!important}
 .pm-body{padding:0!important;overflow:visible!important}
 #scaleBox{width:auto!important;height:auto!important;overflow:visible!important;margin:0!important}
 #printSheet{transform:none!important;box-shadow:none!important;margin:0!important}
}
</style>
<style id="pageStyle"></style>
</head>
<body>
<div id="app">
 <header class="top">
  <h1>주차배정표 <span class="ver" id="verBadge">v2.8</span></h1>
  <span id="userBox" class="userbox"></span>
  <nav class="tabs" id="tabs">
   <button data-tab="list" class="on">주차배정</button>
   <button data-tab="input">배정입력</button>
   <button data-tab="usher">안내인 배정</button>
   <button data-tab="meet">집회 임명</button>
   <button data-tab="rules">고려사항</button>
   <button data-tab="settings">설정</button>
  </nav>
 </header>
 <main>
  <!-- 주차배정 (뷰어) -->
  <section class="page on" id="page-list">
   <div class="card" style="padding-bottom:6px">
    <h2>주차 배정 리스트 <span class="hint" id="rangeInfo"></span></h2>
    <div class="bar">
     <button class="btn pri" id="btnPrint">PDF 출력 / 인쇄</button>
     <button class="btn" id="btnShare">텍스트·이미지 공유</button>
     <button class="btn" id="btnFoldAll">모두 접기</button><button class="btn" id="btnUnfoldAll">모두 펼치기</button>
     <span style="flex:1"></span>
     <span class="hint">글자 크기</span>
     <button class="btn sm" id="fsDown">A−</button>
     <input type="range" id="fsRange" min="12" max="34" step="1" style="width:110px;padding:0">
     <button class="btn sm" id="fsUp">A+</button>
     <span class="hint" id="fsVal"></span>
    </div>
    <p class="hint" style="margin:0 0 8px">• 이 화면은 <b>배정입력</b> 표를 그대로 보여주는 뷰어입니다. 수정·노쇼 체크·엑셀 내보내기는 배정입력 탭에서 합니다.</p>
   </div>
   <div id="viewWrap"></div>
  </section>

  <!-- 배정입력 -->
  <section class="page" id="page-input"><div id="inputWrap"></div></section>

  <!-- 고려사항 -->
  <section class="page" id="page-rules"><div class="card rules" id="rulesWrap"></div></section>

  <!-- 안내인 배정 -->
  <section class="page" id="page-usher"><div id="usherWrap"></div></section>

  <!-- 집회 임명 -->
  <section class="page" id="page-meet"><div id="meetWrap"></div></section>

  <!-- 설정 -->
  <section class="page" id="page-settings">
   <div class="bar" style="justify-content:space-between;margin-bottom:6px">
    <h2 style="margin:0;font-size:17px">설정</h2>
    <button class="btn pri" id="btnRelease">릴리즈 노트</button>
   </div>
   <div id="settingsWrap"></div>
  </section>
 </main>
</div>

<!-- 릴리즈 노트 -->
<div class="modal" id="relModal"><div class="mbox2">
 <h2>릴리즈 노트 <button class="close" data-close="relModal">×</button></h2>
 <div id="relBody"></div>
</div></div>

<!-- 공유(주차 배정) -->
<div class="modal" id="shareModal"><div class="mbox2">
 <h2>공유 <button class="close" data-close="shareModal">×</button></h2>
 <div class="row">
  <label>시작 일자 <select id="shDate"></select></label>
  <label>건수 <input type="number" id="shCount" min="1" max="12" value="1" style="width:60px"></label>
 </div>
 <div class="row">
  <label><input type="radio" name="shFmt" value="text" checked> 텍스트</label>
  <label><input type="radio" name="shFmt" value="image"> 이미지</label>
  <label id="lbH"><input type="checkbox" id="shH" checked> 머리말</label>
  <label id="lbG"><input type="checkbox" id="shG" checked> 인사말</label>
  <label><input type="checkbox" id="shU"> 안내인 포함</label>
 </div>
 <div id="shTextBox">
  <textarea id="shText" rows="12"></textarea>
  <div class="bar" style="margin-top:8px"><button class="btn pri" id="shCopy">복사</button><button class="btn" id="shSend">공유</button></div>
 </div>
 <div id="shImgBox" style="display:none">
  <canvas id="shCanvas" class="pv"></canvas>
  <div class="bar" style="margin-top:8px"><button class="btn pri" id="shSave">이미지 저장</button><button class="btn" id="shImgSend">이미지 공유</button></div>
 </div>
 <p class="hint">머리말·인사말 사용 여부와 문구는 <b>설정 &gt; 공유 템플릿</b>에서 관리합니다.</p>
</div></div>

<!-- 공유(누적 기록) -->
<div class="modal" id="statModal"><div class="mbox2" style="max-width:640px">
 <h2>누적 기록 공유 <button class="close" data-close="statModal">×</button></h2>
 <div class="row">
  <label><input type="radio" name="stFmt" value="text" checked> 텍스트</label>
  <label><input type="radio" name="stFmt" value="image"> 이미지</label>
  <span class="hint" id="stInfo"></span>
 </div>
 <div id="stTextBox">
  <textarea id="stText" rows="12"></textarea>
  <div class="bar" style="margin-top:8px"><button class="btn pri" id="stCopy">복사</button><button class="btn" id="stSend">공유</button></div>
 </div>
 <div id="stImgBox" style="display:none">
  <div class="tw"><canvas id="stCanvas" class="pv"></canvas></div>
  <div class="bar" style="margin-top:8px"><button class="btn pri" id="stSave">이미지 저장</button><button class="btn" id="stImgSend">이미지 공유</button></div>
 </div>
 <p class="hint">기간과 컬럼은 <b>설정 &gt; 누적평균 기록</b>에서 선택한 값이 적용됩니다.</p>
</div></div>

<!-- 출력 미리보기 -->
<div class="modal" id="printModal"><div class="pm">
 <div class="pm-bar">
  <label>방향 <select id="poOrient"><option value="landscape">가로</option><option value="portrait">세로</option></select></label>
  <label>폰트 <select id="poFont"></select></label>
  <label>크기(px) <input type="number" id="poSize" min="6" max="40" style="width:64px"></label>
  <label>표 너비(%) <input type="number" id="poTW" min="40" max="100" step="5" style="width:60px"></label>
  <label><input type="checkbox" id="poFit"> 한 페이지로 맞춤</label>
  <label><input type="checkbox" id="poScreen"> 디자인 출력</label>
  <label><input type="checkbox" id="poNote"> 비고 표시</label>
  <label><input type="checkbox" id="poUsher"> 안내인 포함</label>
  <span class="hint" id="poInfo"></span>
  <span style="flex:1"></span>
  <button class="btn pri" id="poPrint">인쇄 / PDF 저장</button>
  <button class="btn" id="poClose">닫기</button>
 </div>
 <div class="pm-body" id="pmBody"><div id="scaleBox"><div id="printSheet"><div id="sheetInner"></div></div></div></div>
</div></div>

<div class="toast" id="toast"></div>

<div class="modal" id="loginModal"><div class="authbox">
 <h3>로그인</h3>
 <div class="hint">발급받은 코드를 입력하세요. (예: 형식+6자리)</div>
 <input type="password" id="lgCode" autocomplete="off" placeholder="코드 입력">
 <div class="err" id="lgErr"></div>
 <button class="btn pri" id="lgGo" style="width:100%">로그인</button>
 <p class="hint" style="margin:10px 0 0"><a href="#" id="lgSrv">서버 주소 설정</a> <span id="lgSrvInfo"></span></p>
</div></div>
<div class="modal" id="chgModal"><div class="authbox">

function viGroups(){const g=S.settings.viGroups||[];if(g.length)return g;return groupsOf().filter(x=>x.includes('베트남'))}

function dutySelect(d,key,base,ph){
 const du=S.duties[d]||{},cur=person(du[key])?du[key]:'';
 const isVi=key.endsWith('|vi')&&BILING.includes(dutyBase(key));
 const list=S.people.filter(p=>p.roles.includes(base)&&(!isVi||viAllowed(p))).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
 let o=`<option value="">${ph===undefined?'-':ph}</option>`;const seen=new Set();
 list.forEach(p=>{seen.add(p.id);const ab=absentOn(d,p.id);o+=`<option value="${p.id}"${p.id===cur?' selected':''}${ab&&p.id!==cur?' disabled':''}>${esc(p.name)}${ab?' (부재)':''}</option>`});
 if(cur&&!seen.has(cur))o+=`<option value="${cur}" selected>${esc(person(cur).name)}</option>`;
 const cls=BILING.includes(dutyBase(key))?(key.endsWith('|vi')?'lv':'lk'):'';

function visibleDates(){
 const st=S.settings;const t=new Date();t.setHours(0,0,0,0);
 const start=addDays(t,-st.hideDays);
 const end=new Date(t.getFullYear(),t.getMonth()+st.showMonths,t.getDate());
 const set=new Set();
 for(let d=new Date(start);d<=end;d=addDays(d,1)){
  if(st.weekdays.includes(d.getDay()))set.add(ymd(d));
 }
 S.extraDates.forEach(s=>{const d=parse(s);if(d>=start&&d<=end)set.add(s)});
 Object.keys(S.assign).forEach(s=>{const d=parse(s);if(d>=start&&d<=end&&st.areas.some(a=>S.assign[s][a.key]))set.add(s)});
 S.removedDates.forEach(s=>set.delete(s));
 return [...set].sort();
}
function weekKey(s){const d=parse(s);return ymd(addDays(d,-((d.getDay()+6)%7)))}
function targetsOf(d){return S.settings.bundle?visibleDates().filter(x=>weekKey(x)===weekKey(d)):[d]}
/* 같은 인원의 직전/다음 주차 배정일 (같은 주·행사 일자 제외) */
function neighborAssign(d,pid,dir){
 const wk=weekKey(d);let hit=null;
 Object.keys(S.assign).forEach(k=>{
  if(k===d||weekKey(k)===wk||isEvent(k))return;
  if(dir<0?k>d:k<d)return;
  if(!S.settings.areas.some(a=>S.assign[k][a.key]===pid))return;
  if(!hit||(dir<0?k>hit:k<hit))hit=k;
 });
 return hit;
}
/* 기준: 직전 배정일 → 이번 배정일 간격이 (주×7)일 미만이면 직전 배정일 반환 */
function recentPrev(d,pid){
 const w=S.settings.recentWeeks;if(!w||!pid)return null;
 const k=neighborAssign(d,pid,-1);
 return (k&&dayGap(d,k)<w*7)?k:null;
}
function recentNext(d,pid){
 const w=S.settings.recentWeeks;if(!w||!pid)return null;
 const k=neighborAssign(d,pid,1);
 return (k&&dayGap(d,k)<w*7)?k:null;
}
function recentConflict(d,pid){return recentPrev(d,pid)||recentNext(d,pid)}
/* ----- 부재 ----- */
function absentOn(d,pid){return S.absences.find(a=>a.pid===pid&&d>=a.from&&d<=a.to)||null}
function absLine(d){
 const L=S.absences.filter(a=>d>=a.from&&d<=a.to&&person(a.pid));
 if(!L.length)return '';
 return `<div class="abn">부재: ${L.map(a=>esc(person(a.pid).name)+(a.reason?`(${esc(a.reason)})`:'')).join(', ')}</div>`;
}
function absConflicts(ab){
 const t=todayStr(),hits=[];
 Object.keys(S.assign).forEach(d=>{
  if(d<ab.from||d>ab.to||d<t)return;
  S.settings.areas.forEach(a=>{if(S.assign[d][a.key]===ab.pid)hits.push({text:`${label(d)} ${a.name} 주차`,clear:()=>{S.assign[d][a.key]='';delete S.noshow[d+'|'+a.key]}})});
 });
 Object.keys(S.ushers).forEach(d=>{

  ushersOf(d).forEach((x,i)=>{if(x===ab.pid)hits.push({text:`${label(d)} 안내인${i+1}`,clear:()=>{const U=ushersOf(d);U[i]='';S.ushers[d]=U}})});
 });
 Object.keys(S.duties).forEach(d=>{
  if(d<ab.from||d>ab.to||d<t)return;
  Object.keys(S.duties[d]).forEach(r=>{if(S.duties[d][r]===ab.pid)hits.push({text:`${label(d)} 책임(${dutyName(r)})`,clear:()=>{delete S.duties[d][r]}})});
 });
 return hits;
}
/* ----- 안내인 월 단위 ----- */
function monthIdx(ym){const [y,m]=ym.split('-').map(Number);return y*12+m}
function usherTargets(d){
 if(!S.settings.usherMonthly)return [d];
 const t=todayStr(),ym=d.slice(0,7);
 const set=new Set(visibleDates().filter(x=>x.slice(0,7)===ym&&!isEvent(x)&&x>=t));
 set.add(d);
 return [...set].sort();
}
function setUsherMulti(d,i,pid){

 }
 ts.forEach(x=>{
  if(pid&&x!==d&&absentOn(x,pid)){skipped++;return}
  const U=ushersOf(x);U[i]=pid;S.ushers[x]=U;
 });

 if(ts.length>1)toast(`같은 달 ${ts.length-skipped}개 일자에 적용${skipped?` · 부재 ${skipped}일 제외`:''}`);
 return true;
}
function usherMonthScore(p,ym){
 const idx=monthIdx(ym),served=new Set();
 Object.keys(S.ushers).forEach(k=>{if(ushersOf(k).includes(p.id))served.add(k.slice(0,7))});
 let pen=0;
 served.forEach(m=>{if(m===ym)return;const diff=Math.abs(monthIdx(m)-idx);if(diff===1)pen+=6;else if(diff<=3)pen+=2});
 const f=S.settings.freqDir==='high'?p.freq:(4-p.freq);
 return f*2-pen+Math.random()*0.8;
}
function dayGap(a,b){return Math.round(Math.abs((parse(a)-parse(b))/86400000))}
const isClosed=ym=>S.settings.ui.collapsed.includes(ym);
const isBoxClosed=k=>S.settings.ui.boxClosed.includes(k);
function boxH(k,title,extra){return `<h2><span class="bt" data-box="${k}" title="눌러서 접기/펼치기"><span class="car">${isBoxClosed(k)?'▶':'▼'}</span>${title}</span>${extra||''}</h2>`}
function monthUshers(dates){
 const cnt={},ord={};
 dates.forEach(d=>{if(isEvent(d))return;ushersOf(d).forEach((pid,i)=>{const p=person(pid);if(!p)return;cnt[p.name]=(cnt[p.name]||0)+1;if(!(p.name in ord)||i<ord[p.name])ord[p.name]=i})});
 return Object.keys(cnt).sort((a,b)=>ord[a]-ord[b]||cnt[b]-cnt[a]||a.localeCompare(b,'ko'));
}
function monthUshersHtml(dates){

 return `<span class="mu" title="${esc(n.join(', '))}"><span class="mul">안내인</span> <span class="mun">${esc(shown.join(', '))}${n.length>6?` 외 ${n.length-6}명`:''}</span></span>`;
}
function sortPeople(list){
 const k=peopleSort.key;if(!k)return list;
 const rs=S.settings.roles,dir=peopleSort.dir;
 const key=p=>{
  if(k==='name')return p.name;
  if(k==='group')return (p.group||'').trim();
  if(k==='roles'){const ix=p.roles.map(r=>rs.indexOf(r)).filter(i=>i>=0);return ix.length?Math.min(...ix):999}
  if(k==='elder')return p.elder?1:0;
  if(k==='freq')return p.freq;
  if(k==='time')return ['none','start','end'].indexOf(p.time);
  return 0;
 };
 return list.map((p,i)=>({p,i,v:key(p)})).sort((a,b)=>{
  let c;
  if(typeof a.v==='string'){
   if(k==='group'&&(!a.v||!b.v)&&a.v!==b.v)return a.v?-1:1;
   c=a.v.localeCompare(b.v,'ko');
  }else c=a.v-b.v;
  if(c)return c*dir;
  return a.p.name.localeCompare(b.p.name,'ko')||a.i-b.i;
 }).map(x=>x.p);
}
const sortMark=k=>peopleSort.key===k?(peopleSort.dir===1?' ▲':' ▼'):'';
const md=s=>{const d=parse(s);return `${pad(d.getMonth()+1)}/${pad(d.getDate())}`};
/* 안내인(= 책임 '안내인') 후보 */
function usherCandidates(){

 if(S.settings.usherPool==='role'){const rp=S.people.filter(p=>p.roles.includes('안내인'));if(rp.length)pool=rp}
 return pool;
}

 /* v1.9: 수동 입력은 전 인원 선택 가능(사회자·기타책임·부재 포함). 안내인 후보를 먼저 표시 */
 const cand=new Set(usherCandidates().map(p=>p.id));
 const srt=a=>[...a].sort((x,y)=>x.name.localeCompare(y.name,'ko'));
 const one=p=>{const ab=d?absentOn(d,p.id):null;
  return `<option value="${p.id}"${p.id===sel?' selected':''}>${esc(p.name)}${ab?' (부재)':''}</option>`};
 const a=srt(S.people.filter(p=>cand.has(p.id))),b=srt(S.people.filter(p=>!cand.has(p.id)));
 let o='<option value="">-</option>'+a.map(one).join('');
 if(b.length)o+=`<optgroup label="그 외 인원">${b.map(one).join('')}</optgroup>`;
 if(sel&&!person(sel))o+=`<option value="${sel}" selected>(삭제된 인원)</option>`;
 return o;
}
function clearParking(from,to){const t=todayStr();Object.keys(S.assign).forEach(d=>{if(d>=from&&d<=to&&d>=t)S.settings.areas.forEach(a=>{S.assign[d][a.key]=''})})}

/* ===== 배정 검증 / 자동 배정 ===== */
function validate(d,a,pid){
 const p=person(pid),area=areaOf(a),r=[];if(!p||!area)return r;
 const ab=absentOn(d,pid);if(ab)r.push('부재'+(ab.reason?`(${ab.reason})`:''));
 const du=S.duties[d]||{};
 Object.keys(du).forEach(role=>{if(du[role]===pid)r.push(`당일 '${dutyName(role)}' 책임 보유`)});
 if(ushersOf(d).includes(pid))r.push('같은 날 안내인으로 배정됨');
 const A=S.assign[d]||{};
 S.settings.areas.forEach(x=>{if(x.key!==a&&A[x.key]===pid)r.push(`같은 날 ${x.name}에 이미 배정`)});
 if(p.time==='start'&&area.time!=='start')r.push('시작 시간만 가능한 인원 → 시작 구역만 배정 가능');
 if(p.time==='end'&&area.time!=='end')r.push('마치는 시간만 가능한 인원 → 마침 구역만 배정 가능');
 if(p.elder&&!area.elder)r.push('연로자 배정 제한 구역');
 const wk=weekKey(d);let cnt=0;
 Object.keys(S.assign).forEach(dd=>{if(dd!==d&&weekKey(dd)===wk&&!isEvent(dd)){S.settings.areas.forEach(x=>{if(S.assign[dd][x.key]===pid)cnt++})}});
 if(cnt>=S.settings.maxPerWeek)r.push(`같은 주 최대 ${S.settings.maxPerWeek}회 초과`);
 return r;
}
function score(p,d){
 const st=S.settings;const f=st.freqDir==='high'?p.freq:(4-p.freq);
 const dd=parse(d);let recent=0,near=0;
 Object.keys(S.assign).forEach(k=>{
  if(k===d)return;const diff=Math.abs((parse(k)-dd)/86400000);
  st.areas.forEach(a=>{if(S.assign[k][a.key]===p.id){if(diff<=28)recent++;if(diff<=3)near++}});
 });
 let s=f*2-recent*1.5+Math.random()*0.8;
 if(st.avoidConsecutive)s-=near*3;
 if(recentConflict(d,p.id))s-=25;
 return s;
}
/* 남은 구역(rest)을 모두 채울 수 있는지(서로 다른 인원으로) 확인 — 이분 매칭 */
function feasibleRest(d,rest){
 const allowed=rest.map(a=>S.people.filter(p=>validate(d,a.key,p.id).length===0).map(p=>p.id));
 const owner={};
 function aug(i,seen){
  for(const pid of allowed[i]){
   if(seen[pid])continue;seen[pid]=1;
   if(owner[pid]===undefined||aug(owner[pid],seen)){owner[pid]=i;return true}
  }
  return false;
 }
 for(let i=0;i<rest.length;i++){if(!aug(i,{}))return false}
 return true;
}
function bestFor(d,a,rest){
 const A=S.assign[d];
 const cand=S.people.filter(p=>validate(d,a.key,p.id).length===0);
 if(!cand.length)return null;
 const scored=cand.map(p=>({p,s:score(p,d)})).sort((x,y)=>y.s-x.s);
 if(!rest.length)return scored[0].p;
 const prev=A[a.key];
 for(const c of scored){A[a.key]=c.p.id;const ok=feasibleRest(d,rest);A[a.key]=prev;if(ok)return c.p}
 return scored[0].p;
}
/* 순서: 일자 위→아래, 각 일자 안에서 구역 A→D(좌→우). 묶음 켜짐 시 같은 주의 다른 일자 같은 구역에도 같은 인원을 적용 */
function autoAssign(from,to,mode){
 const t=todayStr(),areas=S.settings.areas;
 const dates=visibleDates().filter(d=>d>=from&&d<=to&&d>=t&&!isEvent(d));
 const log=[];let filled=0;
 dates.forEach(d=>{S.assign[d]=S.assign[d]||{};if(mode==='redo')areas.forEach(a=>{S.assign[d][a.key]=''})});
 dates.forEach(d=>{
  areas.forEach((a,idx)=>{
   const A=S.assign[d];
   if(person(A[a.key]))return;
   const rest=areas.slice(idx+1).filter(x=>!person(A[x.key]));
   const p=bestFor(d,a,rest);
   if(!p){log.push(`· ${label(d)} ${a.name}: 배정 가능 인원 없음`);return}
   A[a.key]=p.id;filled++;
   if(S.settings.bundle){
    dates.filter(x=>x!==d&&weekKey(x)===weekKey(d)).forEach(d2=>{
     const A2=S.assign[d2];if(person(A2[a.key]))return;
     if(validate(d2,a.key,p.id).length)return;
     const prev=A2[a.key];A2[a.key]=p.id;
     const rest2=areas.filter(x=>x.key!==a.key&&!person(A2[x.key]));
     if(rest2.length&&!feasibleRest(d2,rest2)){A2[a.key]=prev;return}
     filled++;
    });
   }
  });
 });
 save();
 return {dates:dates.length,filled,log,bundle:S.settings.bundle};
}

/* ===== 안내인 검증 / 자동 배정 ===== */
function validateUsher(d,idx,pid,strict){
 /* v1.9: strict(자동 배정)만 부재·책임 겹침을 제외. 수동 입력은 허용 */
 const r=[];if(!person(pid))return r;
 if(strict){
 const ab=absentOn(d,pid);if(ab)r.push('부재'+(ab.reason?`(${ab.reason})`:''));
 const du=S.duties[d]||{};
 Object.keys(du).forEach(role=>{if(du[role]===pid)r.push(`당일 '${dutyName(role)}' 책임 보유`)});
 }
 const A=S.assign[d]||{};
 S.settings.areas.forEach(a=>{if(A[a.key]===pid)r.push(`${a.name} 주차 배정과 겹침`)});
 ushersOf(d).forEach((x,i)=>{if(i!==idx&&x===pid)r.push('같은 날 다른 안내인 칸에 이미 배정')});
 return r;
}
function usherScore(p,d){
 const dd=parse(d);let recent=0,near=0;
 Object.keys(S.ushers).forEach(k=>{
  if(k===d)return;const diff=Math.abs((parse(k)-dd)/86400000);
  ushersOf(k).forEach(x=>{if(x===p.id){if(diff<=28)recent++;if(diff<=3)near++}});
 });
 Object.keys(S.assign).forEach(k=>{
  const diff=Math.abs((parse(k)-dd)/86400000);
  S.settings.areas.forEach(a=>{if(S.assign[k][a.key]===p.id&&diff<=3&&k!==d)near++});
 });
 const f=S.settings.freqDir==='high'?p.freq:(4-p.freq);
 return f*2-recent*1.5-near*2+Math.random()*0.8;
}
function autoUshers(from,to,mode){
 const t=todayStr(),slots=S.settings.usherSlots;
 const pool=usherCandidates();
 const dates=visibleDates().filter(d=>d>=from&&d<=to&&d>=t&&!isEvent(d));
 let filled=0;const log=[];
 const monthly=S.settings.usherMonthly;
 if(monthly){
  /* 월 단위: 같은 달(1일~말일)의 일자에는 같은 안내인을 배정 (전·후월 연속은 후순위) */
  groupMonths(dates).forEach(g=>{
   g.dates.forEach(d=>{const U=ushersOf(d);S.ushers[d]=U;if(mode==='redo')for(let i=0;i<slots;i++)U[i]=''});
   for(let i=0;i<slots;i++){
    const need=g.dates.filter(d=>!person(S.ushers[d][i]));
    if(!need.length)continue;
    const pools=[pool];if(pool!==S.people)pools.push(S.people);
    let pick=null;
    for(const pl of pools){
     let best=null;
     pl.forEach(p=>{
      const ok=need.filter(d=>validateUsher(d,i,p.id,true).length===0);
      if(!ok.length)return;
      const full=ok.length===need.length;
      if(!full&&ok.length<Math.ceil(need.length/2))return;
      const sc=usherMonthScore(p,g.ym)+(full?100:ok.length/need.length*50);
      if(!best||sc>best.sc)best={p,ok,sc};
     });
     if(best){pick=best;break}
    }
    if(pick)pick.ok.forEach(d=>{S.ushers[d][i]=pick.p.id;filled++});
   }
  });
 }
 const m2=monthly?'fill':mode;
 dates.forEach(d=>{
  const U=ushersOf(d);S.ushers[d]=U;
  if(m2==='redo')for(let i=0;i<slots;i++)U[i]='';
  for(let i=0;i<slots;i++){
   if(person(U[i]))continue;
   let list=pool.filter(p=>validateUsher(d,i,p.id,true).length===0);
   if(!list.length&&pool!==S.people)list=S.people.filter(p=>validateUsher(d,i,p.id,true).length===0);
   if(!list.length){log.push(`· ${label(d)} 안내인${i+1}: 배정 가능 인원 없음`);continue}
   let best=null,bs=-1e9;list.forEach(p=>{const s=usherScore(p,d);if(s>bs){bs=s;best=p}});
   U[i]=best.id;filled++;
  }
 });
 save();
 return {dates:dates.length,filled,log};
}

function addNames(raw,roles,freq,group,spaceSplit){
 const txt=String(raw);

 const names=(hasSep?txt.split(/[,，、;\n\t]+/):(spaceSplit?txt.split(/\s+/):[txt])).map(x=>x.trim()).filter(Boolean);
 if(!names.length){toast('등록할 이름을 입력하세요');return false}
 const exist=new Set(S.people.map(p=>p.name));let add=0;const dup=[];
 names.forEach(n=>{if(exist.has(n)){dup.push(n);return}exist.add(n);S.people.push({id:uid(),name:n,roles:[...roles],freq,group:group||'',elder:false,time:'none'});add++});
 S.settings.ui.listOpen=true;
 save();renderInput();
 toast(`${add}명 등록${dup.length?` · 중복 ${dup.length}명 제외(${dup.slice(0,3).join(', ')}${dup.length>3?'…':''})`:''}`);
 return true;
}

/* ===== 집회 임명 (v2.0) ===== */
/* v2.4: 집회사회자=주중만, 사회(주말집회)=주말만 표기 / 일괄 입력 */
let meetFilter='all';
let meetLang={'집회사회자':'all','사회(주말집회)':'all'};
let meetBulk={col:'집회사회자',lang:'ko',text:'',start:'',skip:false,log:''};
const isWkend=d=>[0,6].includes(dowOf(d));
const meetApplies=(col,d)=>col==='사회(주말집회)'?isWkend(d):!isWkend(d);
const meetKey=(col,lang)=>col+(lang==='vi'?'|vi':'');
function meetBulkDates(){return visibleDates().filter(d=>d>=todayStr()&&!isEvent(d)&&meetApplies(meetBulk.col,d))}
function meetBulkBox(){
 const m=meetBulk,ds=meetBulkDates();
 if(!ds.includes(m.start))m.start=ds[0]||'';
 return '<div class="addbox"><div class="row"><b>일괄 입력</b>'+
  `<select id="mbCol"><option value="집회사회자"${m.col==='집회사회자'?' selected':''}>집회 사회자 (주중)</option><option value="사회(주말집회)"${m.col==='사회(주말집회)'?' selected':''}>사회(주말집회) (주말)</option></select>`+
  `<select id="mbLang"><option value="ko"${m.lang==='ko'?' selected':''}>한국어</option><option value="vi"${m.lang==='vi'?' selected':''}>베트남어</option></select>`+
  `<label>시작 일자 <select id="mbStart">${ds.map(d=>`<option value="${d}"${d===m.start?' selected':''}>${label(d)}</option>`).join('')}</select></label>`+
  `<label><input type="checkbox" id="mbSkip"${m.skip?' checked':''}> 이미 임명된 일자는 건너뛰기</label></div>`+
  `<textarea id="mbText" rows="5" style="width:100%;margin:4px 0" placeholder="이름을 한 줄에 한 명씩 붙여넣으세요 (엑셀 열 복사 가능). 시작 일자부터 해당 요일 일자에 순서대로 임명됩니다. '--' 또는 빈 줄은 그 일자를 건너뜁니다(변경 없음).">${esc(m.text)}</textarea>`+
  '<div class="row"><button class="btn pri" id="btnMbApply">일괄 적용</button><button class="btn" id="btnMbCopy">현재 임명 복사</button><button class="btn" id="btnMbClear">입력 지우기</button></div>'+
  (m.log?`<div class="hint" style="white-space:pre-line">${esc(m.log)}</div>`:'')+'</div>';
}
function meetBulkApply(){
 const m=meetBulk,key=meetKey(m.col,m.lang),ds=meetBulkDates().filter(d=>d>=m.start);
 let lines=m.text.replace(/\r/g,'').split('\n').map(s=>s.split('\t')[0].trim());
 if(lines.length===1&&/[,，]/.test(lines[0]))lines=lines[0].split(/[,，]/).map(s=>s.trim());
 while(lines.length&&!lines[lines.length-1])lines.pop();
 if(!lines.length){m.log='입력된 이름이 없습니다.';renderMeet();return}
 const plan=[],skips=[];
 lines.forEach((nm,i)=>{
  if(!nm||nm==='--')return;
  const d=ds[i];
  if(!d){skips.push(`${nm}: 배정할 일자 없음`);return}
  const p=S.people.find(x=>x.name===nm);
  if(!p){skips.push(`${label(d)} ${nm}: 등록되지 않은 이름`);return}
  if(!p.roles.includes(m.col)){skips.push(`${label(d)} ${nm}: '${m.col}' 책임 미체크`);return}
  if(m.lang==='vi'&&!viAllowed(p)){skips.push(`${label(d)} ${nm}: 베트남어 집단 소속 아님`);return}
  const ab=absentOn(d,p.id);if(ab){skips.push(`${label(d)} ${nm}: 부재`);return}
  const du=S.duties[d]||{};const other=Object.keys(du).find(k=>dutyClash(key,k)&&du[k]===p.id);
  if(other){skips.push(`${label(d)} ${nm}: 같은 날 '${dutyName(other)}' 책임 있음`);return}
  if(m.skip&&person(du[key])){skips.push(`${label(d)} ${nm}: 이미 임명됨(건너뜀)`);return}
  plan.push({d,pid:p.id,nm});
 });
 const park=plan.filter(x=>{const A=S.assign[x.d]||{};return S.settings.areas.some(a=>A[a.key]===x.pid)});
 if(park.length&&!confirm(`${park.length}건은 같은 날 주차 구역에 배정되어 있습니다. 임명하면 해당 구역 배정에서 제외합니다.\n\n- ${park.slice(0,6).map(x=>label(x.d)+' '+x.nm).join('\n- ')}${park.length>6?'\n…':''}\n\n계속할까요?`))return;
 plan.forEach(x=>{
  const A=S.assign[x.d]||{};S.settings.areas.forEach(a=>{if(A[a.key]===x.pid)A[a.key]=''});
  S.duties[x.d]=S.duties[x.d]||{};S.duties[x.d][key]=x.pid;
 });
 save();
 m.log=`${plan.length}건 적용${skips.length?` · 제외 ${skips.length}건\n- `+skips.slice(0,12).join('\n- ')+(skips.length>12?'\n…':''):''}`;
 renderMeet();toast(`일괄 입력: ${plan.length}건 적용`);
}
function radios(name,attr,val,opts){

}

 return radios('mfl-'+col,`data-mflang="${esc(col)}" `,meetLang[col],[['all','전체'],['ko','한국어'],['vi','베트남어']])+

function langCell(d,col){
 const v=meetLang[col];
 return (v!=='vi'?dutySelect(d,col,col,''):'')+(v!=='ko'?dutySelect(d,col+'|vi',col,''):'');

function renderMeet(){
 const t=todayStr(),dates=visibleDates().filter(d=>d>=t&&(meetFilter==='all'||(meetFilter==='we'?isWkend(d):!isWkend(d))));
 let h='<div class="card"><h2>집회 임명</h2>'+meetBulkBox()+`<div class="row"><label><input type="checkbox" id="mfMonth"${S.settings.ui.meetMonth?' checked':''}> 월별 경계 표시</label></div>`;
 if(!dates.length)h+='<div class="empty">표시할 일자가 없습니다. (설정 &gt; 기본 설정의 배정 요일 기준'+(meetFilter!=='all'?' · 필터 적용 중':'')+')</div>';
 else{
  h+=`<div class="tw"><table class="grid duty meet" style="table-layout:fixed;width:100%"><colgroup><col style="width:16%"><col style="width:28%"><col style="width:28%"><col style="width:28%"></colgroup><thead><tr><th>일자${radios('mfday','data-mfday="x" ',meetFilter,[['all','전체'],['we','주말'],['wd','주중']]).replace(/data-mfday="x" value="(\w+)"/g,'data-mfday="$1" value="$1"')}</th><th>집회 사회자<small>한국어/베트남어 · 주중</small>${langSel('집회사회자')}</th><th>사회(주말집회)<small>한국어/베트남어 · 주말</small>${langSel('사회(주말집회)')}</th><th>기타책임</th></tr></thead><tbody>`;
  const na='<span class="hint">-</span>';let pym='';
  dates.forEach(d=>{
   const dw=dowOf(d),wk=isWkend(d);
   if(S.settings.ui.meetMonth&&d.slice(0,7)!==pym){pym=d.slice(0,7);h+=`<tr class="mrow"><td colspan="4">${pym}</td></tr>`}
   h+=`<tr class="${dw===0?'sun':dw===6?'sat':''}"><td class="dcell" style="text-align:center"><b>${label(d)}</b>${isEvent(d)?`<br><span class="hint">${esc(evName(d)||'특별 행사')}</span>`:''}${recurHtml(d)}</td>`+
    '<td>'+(wk?na:langCell(d,'집회사회자'))+'</td>'+
    '<td>'+(wk?langCell(d,'사회(주말집회)'):na)+'</td>'+
    '<td>'+dutySelect(d,'기타책임','기타책임')+'</td></tr>';
  });
  h+='</tbody></table></div>';
 }

 const y=window.scrollY;$('meetWrap').innerHTML=h;window.scrollTo(0,y);
}
$('meetWrap').addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.mflang){meetLang[el.dataset.mflang]=el.value;renderMeet();return}
 if(el.dataset.mfday){meetFilter=el.dataset.mfday;renderMeet();return}
 if(el.id==='mfMonth'){S.settings.ui.meetMonth=el.checked;save();renderMeet();return}
 if(el.id==='mbCol'){meetBulk.col=el.value;meetBulk.start='';renderMeet();return}

$('meetWrap').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.mreset){
  const col=b.dataset.mreset,lv=meetLang[col],keys=[];
  if(lv!=='vi')keys.push(col);if(lv!=='ko')keys.push(col+'|vi');
  const t0=todayStr();let n=0;
  Object.keys(S.duties).forEach(d=>{if(d>=t0)keys.forEach(k=>{if(S.duties[d][k])n++})});
  if(!n){toast('리셋할 임명이 없습니다');return}
  if(!confirm(`'${col}' ${lv==='all'?'한국어·베트남어':lv==='ko'?'한국어':'베트남어'} 임명 ${n}건(오늘 이후)을 모두 비울까요?`))return;
  Object.keys(S.duties).forEach(d=>{if(d>=t0)keys.forEach(k=>delete S.duties[d][k])});
  save();renderMeet();toast(`${col} 임명 ${n}건 리셋`);return;
 }
 if(b.id==='btnMbApply'){meetBulk.text=$('mbText').value;meetBulkApply()}

  meetBulk.text=txt;meetBulk.log=`${label(meetBulk.start)}부터 ${ds.length}개 일자의 현재 임명을 복사했습니다.`;

 }
});

/* ===== 안내인 배정 ===== */
function renderUsher(){
 const dates=visibleDates(),areas=S.settings.areas,slots=S.settings.usherSlots,t=todayStr();
 const st=S.settings;
 let h='';
 // 겹침 점검
 const conf=[];
 dates.forEach(d=>{if(isEvent(d))return;ushersOf(d).forEach((pid,i)=>{if(!pid)return;const r=validateUsher(d,i,pid);if(r.length)conf.push(`${label(d)} 안내인${i+1} ${person(pid).name}: ${r.join(', ')}`)})});
 h+='<div class="card"><h2>안내인 배정 <span class="hint">주차 배정과 한 화면에서 겹침을 확인합니다</span></h2>';
 h+=conf.length?`<div class="errbox"><b>겹침 ${conf.length}건</b><br>${conf.slice(0,12).map(esc).join('<br>')}${conf.length>12?'<br>…':''}</div>`:'<div class="okbox">✔ 주차 배정과 안내인 간 겹침이 없습니다. (안내인은 사회자·기타책임·부재와 겹쳐 입력할 수 있습니다)</div>';
 h+='<div class="row" style="margin-top:12px">'+
  `<label>기간 <input type="date" id="auFrom" value="${t}"> ~ <input type="date" id="auTo" value="${dates.slice(-1)[0]||t}"></label>`+
  '<label>방식 <select id="auMode"><option value="fill">빈 칸만 채우기</option><option value="redo">기간 내 전체 다시 배정</option></select></label>'+
  '<label class="chip"><input type="checkbox" id="cbUMonthly"'+(st.usherMonthly?' checked':'')+'> 월 단위(1일~말일) 배정</label><button class="btn pri" id="btnUAuto">안내인 자동 배정</button><button class="btn pri" id="btnUChain" style="background:#2e7d5b;border-color:#2e7d5b">안내인 → 주차 연속 자동 배정</button><button class="btn warn" id="btnUClear">기간 내 비우기</button></div>'+
  `<p class="hint">• 이 칸은 <b>배정입력 &gt; 일자별 책임 입력의 '안내인'</b>(책임 &gt; 안내인)와 <b>같은 데이터</b>입니다. 안내인을 먼저 배정한 뒤 주차를 자동 배정하면 안내인은 주차에서 제외됩니다. <b>연속 자동 배정</b>은 이 두 단계를 한 번에 실행합니다(주차는 빈 칸만 채움).<br>• ${st.usherMonthly?'<b>월 단위 배정 켜짐</b> — 같은 달(1일~말일)의 모든 일자에 같은 안내인이 배정되며, 한 칸을 바꾸면 그 달의 오늘 이후 일자에 함께 적용됩니다(부재 일자 제외, 전·후월 연속 근무는 후순위).<br>• ':''}안내인 칸 수 <b>${slots}</b>개 · 후보 범위 <b>${st.usherPool==='role'?"'안내인' 책임 인원(없으면 전체)":'전체 인원'}</b> — <b>설정 &gt; 안내인 설정</b>에서 변경합니다.<br>• 같은 날 주차 배정·일자별 책임·부재와 겹치는 인원은 자동 배정에서 제외됩니다. 수동 선택은 사회자·기타책임·부재 인원도 가능하며, 주차 배정과 겹칠 때만 빨간색으로 표시됩니다.</p><div id="auLog"></div></div>`;
 if(!dates.length)h+='<div class="empty">표시할 일자가 없습니다.</div>';
 groupMonths(dates).forEach(g=>{
  h+=`<div class="mbx"><div class="mh">${g.ym}<small>${g.dates.length}건</small></div><div class="tw"><table class="grid" style="min-width:${300+areas.length*90+slots*120}px"><thead><tr><th style="width:150px">일자</th>`+areas.map(a=>`<th>${esc(a.name)}<small>주차</small></th>`).join('')+Array.from({length:slots},(_,i)=>`<th style="background:#2e7d5b">안내인${i+1}</th>`).join('')+'</tr></thead><tbody>';
  g.dates.forEach(d=>{
   const A=S.assign[d]||{},dw=dowOf(d),U=ushersOf(d);
   h+=`<tr class="${dw===0?'sun':dw===6?'sat':''}${d<t?' past':''}${d===t?' today':''}"><td class="dcell"><b>${label(d)}</b>${recurHtml(d)}</td>`;
   if(isEvent(d))h+=`<td colspan="${areas.length+slots}" class="ev">${esc(evName(d)||'특별 행사')}</td>`;
   else{
    areas.forEach(a=>{const p=person(A[a.key]);const c=p&&U.includes(p.id);h+=`<td class="${c?'conf':''}">${p?esc(p.name):''}</td>`});
    U.forEach((pid,i)=>{const cp=person(pid)?pid:'';const c=cp&&validateUsher(d,i,cp).length;h+=`<td class="${c?'conf':''}"><select data-u="${d}" data-i="${i}">${usherOpts(cp,d)}</select></td>`});
   }
   h+='</tr>';
  });
  h+='</tbody></table></div></div>';
 });
 const y=window.scrollY;
 $('usherWrap').innerHTML=h;window.scrollTo(0,y);
}
$('usherWrap').addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='cbUMonthly'){S.settings.usherMonthly=el.checked;save();renderUsher();toast(el.checked?'안내인 월 단위(1일~말일) 배정: 켜짐':'안내인 월 단위 배정: 꺼짐');return}
 if(el.dataset.u===undefined)return;
 const d=el.dataset.u,i=+el.dataset.i,pid=el.value;
 if(pid){const r=validateUsher(d,i,pid);if(r.length&&!confirm(`다음 원칙에 맞지 않습니다.\n\n- ${r.join('\n- ')}\n\n그래도 배정하시겠습니까?`)){renderUsher();return}}
 if(!setUsherMulti(d,i,pid)){renderUsher();return}
 renderUsher();
});
$('usherWrap').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='btnUAuto'){
  if(!S.people.length){toast('인원을 먼저 등록하세요');return}
  const r=autoUshers($('auFrom').value||'0000-00-00',$('auTo').value||'9999-99-99',$('auMode').value);
  renderUsher();
  $('auLog').innerHTML=`<div class="log">${r.dates}개 일자 처리 · ${r.filled}칸 배정${r.log.length?`\n\n배정하지 못한 칸 (${r.log.length})\n`+esc(r.log.join('\n')):'\n모든 칸이 배정되었습니다.'}</div>`;
  toast('안내인 자동 배정 완료');
 }
 if(b.id==='btnUChain'){
  if(!S.people.length){toast('인원을 먼저 등록하세요');return}
  const from=$('auFrom').value||'0000-00-00',to=$('auTo').value||'9999-99-99',mode=$('auMode').value;
  if(mode==='redo')clearParking(from,to);
  const ur=autoUshers(from,to,mode);
  const pr=autoAssign(from,to,'fill');
  renderUsher();
  const lg=ur.log.concat(pr.log);
  $('auLog').innerHTML=`<div class="log">① 안내인 ${ur.filled}칸 배정 → ② 주차 ${pr.filled}칸 배정${lg.length?`\n\n배정하지 못한 칸 (${lg.length})\n`+esc(lg.join('\n')):'\n모든 칸이 배정되었습니다.'}</div>`;
  toast('안내인 → 주차 연속 자동 배정 완료');
 }
 if(b.id==='btnUClear'){
  const f=$('auFrom').value,to=$('auTo').value,t=todayStr();
  if(!confirm('선택 기간(오늘 이후)의 안내인 배정을 모두 비울까요?'))return;
  Object.keys(S.ushers).forEach(d=>{if(d>=f&&d<=to&&d>=t)S.ushers[d]=ushersOf(d).map(()=>'')});
  save();renderUsher();toast('안내인 배정을 비웠습니다');
 }
});

function renderRules(){

 const el=ar.filter(a=>a.elder).map(a=>a.name).join(', ')||'없음';

 <h2>배정 원칙 <span class="hint">배정입력·안내인 배정 로직과 동일하며, 현재 설정값이 자동 반영됩니다</span></h2>
 <h3>① 필수 원칙 (위반 시 자동 배정 제외 / 수동 배정 시 확인 창)</h3>

function computeStats(from,to){
 const t=todayStr(),end=(to&&to<t)?to:t,res={};
 S.people.forEach(p=>res[p.id]={name:p.name,total:0,start:0,end:0,ns:0});
 let first=null;
 Object.keys(S.assign).sort().forEach(d=>{
  if(d>end||(from&&d<from)||isEvent(d))return;
  S.settings.areas.forEach(a=>{
   const pid=S.assign[d][a.key];if(!pid||!res[pid])return;
   const r=res[pid];r.total++;
   if(a.time==='start'||a.time==='all')r.start++;
   if(a.time==='end'||a.time==='all')r.end++;
   if(S.noshow[d+'|'+a.key])r.ns++;
   if(!first||d<first)first=d;
  });
 });
 const start=from||first||t;
 const span=Math.max(1,(parse(end)-parse(start))/86400000+1);
 return {res,start,end,has:!!first,weeks:Math.max(1,span/7),months:Math.max(1,span/30.4375),years:Math.max(1,span/365.25)};
}
function statVal(r,ss,k){
 if(k==='week')return (r.total/ss.weeks).toFixed(2);
 if(k==='month')return (r.total/ss.months).toFixed(2);
 if(k==='year')return (r.total/ss.years).toFixed(2);
 return String(r[k]);
}
function statData(){
 const ss=computeStats(S.settings.statFrom,S.settings.statTo);
 const cols=STAT_COLS.filter(c=>S.settings.statCols.includes(c.k));
 const rows=Object.values(ss.res).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name,'ko'));
 return {ss,cols,rows};
}

function setPath(path,val){
 const ks=path.split('.');let o=S.settings;
 for(let i=0;i<ks.length-1;i++)o=o[ks[i]];

}
$('settingsWrap').addEventListener('change',e=>{

 if(el.dataset.s){

  else if(el.type==='number')v=Math.min(+el.max||1e9,Math.max(+el.min||0,+el.value||0));

 }else if(el.dataset.sc){
  const set=new Set(S.settings.statCols);el.checked?set.add(el.dataset.sc):set.delete(el.dataset.sc);
  S.settings.statCols=STAT_COLS.map(c=>c.k).filter(k=>set.has(k));save();renderSettings();
 }else if(el.dataset.wd!==undefined){
  const n=+el.dataset.wd;const set=new Set(S.settings.weekdays);el.checked?set.add(n):set.delete(n);
  S.settings.weekdays=[...set].sort();save();toast('저장됨');

  const a=areaOf(el.dataset.area),f=el.dataset.af;
  a[f]=f==='elder'?el.checked:el.value;
  if(f==='name'&&!a.name.trim())a.name='구역'+a.key;
  save();toast('저장됨');

  const f=el.files[0];if(!f)return;const r=new FileReader();

function drawStatImage(){

 rows.forEach((r,idx)=>{
  c.fillStyle=idx%2?'#f4f7fb':'#fff';c.fillRect(P,y,W-P*2,rh);
  c.strokeStyle='#d5dce5';c.beginPath();c.moveTo(P,y+rh);c.lineTo(W-P,y+rh);c.stroke();

function shareModel(){
 const sh=S.settings.share,from=$('shDate').value,n=Math.max(1,Math.min(12,+$('shCount').value||1));
 const dates=visibleDates().filter(d=>d>=from).slice(0,n),withU=$('shU').checked;
 const m={header:(sh.useHeader&&$('shH').checked)?sh.header.trim():'',greeting:(sh.useGreeting&&$('shG').checked)?sh.greeting.trim():'',blocks:[]};
 dates.forEach(d=>{
  const A=S.assign[d]||{};let rows;
  if(isEvent(d))rows=[['행사',evName(d)||'특별 행사']];
  else{
   rows=S.settings.areas.map(a=>{const p=person(A[a.key]);return [a.name,p?p.name:'미배정']});
   if(withU){const un=usherNames(d);rows.push(['안내인',un.length?un.join(', '):'미배정'])}
  }
  m.blocks.push({title:label(d),rows,note:(A.note||'').trim()});
 });

function shareText(m){
 const L=[];if(m.header)L.push(m.header,'');if(m.greeting)L.push(m.greeting,'');
 L.push('[배정구역안내]');
 m.blocks.forEach(b=>{L.push('');L.push('■ '+b.title);b.rows.forEach(r=>L.push(`${r[0]} : ${r[1]}`));if(b.note)L.push('※ '+b.note)});
 return L.join('\n');
}
function drawShareImage(m){
 const cv=$('shCanvas'),W=720,P=36,FF="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif";
 const mc=document.createElement('canvas').getContext('2d');
 const wrap=(txt,font,maxW)=>{mc.font=font;const out=[];String(txt).split('\n').forEach(par=>{let cur='';for(const ch of par){if(mc.measureText(cur+ch).width>maxW){out.push(cur);cur=ch}else cur+=ch}out.push(cur)});return out};
 const items=[];let y=0;
 const headT=m.header||S.settings.title;
 const hl=wrap(headT,`700 30px ${FF}`,W-P*2);
 const bandH=hl.length*42+40;
 items.push({k:'rect',x:0,y:0,w:W,h:bandH,c:'#2f5d8a'});
 hl.forEach((t,i)=>items.push({k:'t',t,f:`700 30px ${FF}`,c:'#fff',x:P,y:20+i*42+31}));
 y=bandH+26;
 if(m.greeting){wrap(m.greeting,`400 22px ${FF}`,W-P*2).forEach(t=>{items.push({k:'t',t,f:`400 22px ${FF}`,c:'#333',x:P,y:y+22});y+=34});y+=12}
 items.push({k:'t',t:'[배정구역안내]',f:`700 24px ${FF}`,c:'#2f5d8a',x:P,y:y+24});y+=44;
 m.blocks.forEach(b=>{
  items.push({k:'rect',x:P,y:y,w:W-P*2,h:44,c:'#e8eff7'});
  items.push({k:'t',t:b.title,f:`700 24px ${FF}`,c:'#1c3550',x:P+14,y:y+31});y+=54;
  b.rows.forEach(r=>{
   items.push({k:'t',t:r[0],f:`400 22px ${FF}`,c:'#555',x:P+14,y:y+22});
   items.push({k:'t',t:r[1],f:`700 24px ${FF}`,c:r[1]==='미배정'?'#aaa':'#111',x:P+190,y:y+22});y+=38;
  });
  if(b.note){wrap('※ '+b.note,`400 20px ${FF}`,W-P*2-14).forEach(t=>{items.push({k:'t',t,f:`400 20px ${FF}`,c:'#777',x:P+14,y:y+20});y+=30})}
  y+=16;
 });
 const H=y+16,R=2;
 cv.width=W*R;cv.height=H*R;cv.style.width=Math.min(W,520)+'px';
 const ctx=cv.getContext('2d');ctx.scale(R,R);
 ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 items.forEach(it=>{
  if(it.k==='rect'){ctx.fillStyle=it.c;ctx.fillRect(it.x,it.y,it.w,it.h)}
  else{ctx.font=it.f;ctx.fillStyle=it.c;ctx.textBaseline='alphabetic';ctx.fillText(it.t,it.x,it.y)}
 });
}

/* GitHub Pages 업로드용: 로그인 화면은 이 페이지, 데이터는 구글 앱스 스크립트(웹앱)에 저장.
   배포한 웹앱 URL을 아래에 넣거나(권장), 로그인 화면의 '서버 주소 설정'에서 입력하세요. 비워 두면 이 브라우저(localStorage)에만 저장합니다. */
const GAS_URL_DEFAULT='';
const GAS_KEY='parkingGasUrl_v1',SES_KEY='parkingSession_v1';
const TABS=[['list','주차배정'],['input','배정입력'],['usher','안내인 배정'],['meet','집회 임명'],['rules','고려사항']];
function defaultAccounts(){return [
 {id:'acc_admin',name:'관리자',prefix:'admin',code:'191435',admin:true,edit:true,tabs:TABS.map(x=>x[0]),changed:false},
 {id:'acc_pp',name:'주차배정 열람',prefix:'pp',code:'191435',admin:false,edit:false,tabs:['list'],changed:false}];}
function gasUrl(){try{return localStorage.getItem(GAS_KEY)||GAS_URL_DEFAULT}catch(e){return GAS_URL_DEFAULT}}
let SESSION_CODE='',pushT=null,chgForce=false;
const pubAcc=a=>({id:a.id,name:a.name,prefix:a.prefix,admin:!!a.admin,edit:!!(a.edit||a.admin),tabs:a.tabs||[],changed:!!a.changed});
function tabAllowed(n){if(!ME)return false;if(n==='settings')return ME.admin;return ME.admin||ME.tabs.includes(n)}

async function gasCall(body){
 const url=gasUrl();
 try{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return await res.json()}
 catch(e){return {ok:false,error:'서버에 연결할 수 없습니다. 주소와 배포 설정을 확인하세요.'}}
}

 syncInfo(r.ok?'서버 저장됨 '+new Date().toLocaleTimeString('ko-KR'):'서버 저장 실패: '+(r.error||''));

async function doLogin(input){
 input=(input||'').trim();
 if(!input)return '코드를 입력하세요.';
 if(gasUrl()){
  const r=await gasCall({action:'login',code:input});
  if(!r.ok)return r.error||'로그인에 실패했습니다.';
  ME=r.account;SESSION_CODE=input;

  else if(ME.admin)setTimeout(gasPush,300);
 }else{
  const a=S.auth.accounts.find(x=>(x.prefix+x.code).toLowerCase()===input.toLowerCase());
  if(!a)return '코드가 올바르지 않습니다.';
  ME=pubAcc(a);SESSION_CODE=input;

}

function loginStr(a){return (a.prefix+a.code).toLowerCase()}
function accEdit(el){
 const a=S.auth.accounts.find(x=>x.id===el.dataset.acc);if(!a)return;
 const f=el.dataset.af;
 if(f==='name'){a.name=el.value.trim()||a.name}
 else if(f==='prefix'||f==='code'){
  const nv=f==='prefix'?el.value.trim():el.value.trim();
  if(f==='prefix'&&!/^[A-Za-z]{1,12}$/.test(nv)){toast('코드 형식은 영문 1~12자');renderSettings();return}
  if(f==='code'&&!/^\d{6}$/.test(nv)){toast('코드는 숫자 6자리');renderSettings();return}
  const test={...a,[f]:nv};
  if(S.auth.accounts.some(x=>x.id!==a.id&&loginStr(x)===loginStr(test))){toast('이미 사용 중인 코드입니다');renderSettings();return}

 else if(f==='tab'){a.tabs=a.tabs||[];const k=el.dataset.tab;a.tabs=el.checked?[...new Set([...a.tabs,k])]:a.tabs.filter(x=>x!==k)}

 if(b.id==='btnAddAcc'){
  const name=$('naName').value.trim(),prefix=$('naPrefix').value.trim(),code=$('naCode').value.trim();
  if(!name){toast('이름을 입력하세요');return true}
  if(!/^[A-Za-z]{1,12}$/.test(prefix)){toast('코드 형식은 영문 1~12자');return true}
  if(!/^\d{6}$/.test(code)){toast('코드는 숫자 6자리');return true}
  if(S.auth.accounts.some(x=>loginStr(x)===(prefix+code).toLowerCase())){toast('이미 사용 중인 코드입니다');return true}
  S.auth.accounts.push({id:'acc_'+uid(),name,prefix,code,admin:false,edit:false,tabs:['list'],changed:false});
  authSave();renderSettings();toast('추가됨 · 권한을 설정하세요');return true;
 }
 if(b.dataset.delacc){
  const a=S.auth.accounts.find(x=>x.id===b.dataset.delacc);if(!a)return true;
  if(!confirm(`'${a.name}' (${a.prefix}) 코드를 삭제할까요?`))return true;
  S.auth.accounts=S.auth.accounts.filter(x=>x.id!==a.id);
  if(!S.auth.accounts.some(x=>x.admin)){S.auth.accounts.push(a);toast('관리자 계정이 하나는 있어야 합니다');return true}
  authSave();renderSettings();return true;
 }
 if(b.id==='btnGasUrl'){
  const v=$('gasUrlIn').value.trim();
  if(v&&!/^https:\/\/script\.google\.com\//.test(v)){toast('구글 앱스 스크립트 웹앱 주소(https://script.google.com/…)를 입력하세요');return true}
  try{if(v)localStorage.setItem(GAS_KEY,v);else localStorage.removeItem(GAS_KEY)}catch(e){}
  toast(v?'서버 주소 저장됨 · 다시 로그인할 때 적용':'서버 주소 삭제됨');return true;
 }
 if(b.id==='btnGasPush'){
  if(!gasUrl()){toast('서버 주소를 먼저 저장하세요');return true}
  gasPush().then(ok=>toast(ok?'서버에 저장했습니다':'서버 저장 실패'));return true;
 }
 if(b.id==='btnGasPull'){
  if(!gasUrl()){toast('서버 주소를 먼저 저장하세요');return true}
  if(!confirm('서버의 데이터로 이 화면의 데이터를 덮어쓸까요?'))return true;
  gasCall({action:'load',code:SESSION_CODE}).then(r=>{if(r.ok&&applyServerData(r.data)){renderSettings();toast('서버에서 불러왔습니다')}else toast(r.ok?'서버에 저장된 데이터가 없습니다':(r.error||'불러오기 실패'))});return true;
 }
 return false;
}
function initAuth(){
 $('lgGo').onclick=async()=>{
  $('lgErr').textContent='확인 중…';
  const e=await doLogin($('lgCode').value);
  if(e){$('lgErr').textContent=e;return}
  $('loginModal').classList.remove('open');
  if(!ME.changed)openChange(true);else enterApp();
 };
 $('lgCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('lgGo').click()});
 $('lgSrv').onclick=e=>{
  e.preventDefault();
  const v=prompt('구글 앱스 스크립트 웹앱 URL (비우면 서버 사용 안 함)',gasUrl());
  if(v===null)return;
  const s=v.trim();
  if(s&&!/^https:\/\/script\.google\.com\//.test(s)){alert('https://script.google.com/ 로 시작하는 웹앱 주소를 입력하세요.');return}
  try{if(s)localStorage.setItem(GAS_KEY,s);else localStorage.removeItem(GAS_KEY)}catch(x){}
  $('lgSrvInfo').textContent=s?'· 서버 연결됨':'· 서버 미설정(이 기기 저장)';
 };
 $('chGo').onclick=submitChange;
 $('chNew2').addEventListener('keydown',e=>{if(e.key==='Enter')submitChange()});
 $('chCancel').onclick=()=>$('chgModal').classList.remove('open');
 let ses='';try{ses=sessionStorage.getItem(SES_KEY)||''}catch(e){}
 if(ses){doLogin(ses).then(err=>{if(err){openLogin();return}if(!ME.changed)openChange(true);else enterApp()})}
 else openLogin();
}

/* ===== 시작 ===== */
load();
$('verBadge').textContent='v'+VERSION;
document.title=`${FILE_TITLE} v${VERSION}`;
document.body.classList.add('locked');
initAuth();
</script>
</body>
